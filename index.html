<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">

<!-- 核心SEO -->
<title>留言板 - 在线匿名留言交流社区</title>
<meta name="description" content="轻量匿名留言板，支持发帖、图文视频上传、回复互动，永久免费，电脑手机自适应访问。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://mb.lovefree.de5.net">

<!-- 社交分享卡片（极简版，不重复大段文案） -->
<meta property="og:type" content="website">
<meta property="og:title" content="留言板 - 在线匿名留言交流社区">
<meta property="og:url" content="https://mb.lovefree.de5.net">
<meta property="og:site_name" content="匿名留言板">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cli-header">
  <div class="cli-nav-back" style="display:none;">
      <button class="cli-btn" onclick="goHome()">返回</button>
  </div>
  <div class="cli-nav-buttons">
    <button id="bellBtn" class="cli-btn">
      通知<span id="unReadBadge" style="display:none"></span>
    </button>
    <button id="openPopBtn" class="cli-btn">发帖</button> 
  </div>
 </header>

<main>
  <div id="listBox"></div>
  <div id="loadTip" class="fs-sm" style="text-align:center;padding:18px 0;color:var(--text-second);cursor:default;">
    加载中...
  </div>
</main>

<!-- 通知弹窗遮罩 -->
<div class="notify-mask" id="notifyMask">
  <div class="notify-box" id="notifyWrap">
    <div class="notify-btn-bar" id="notifyOpBar">
      <button class="btn fs-md" id="readAllBtn" onclick="readAllNotify()">全部已读</button>
      <button class="btn del-btn fs-md" id="clearNotifyBtn" onclick="clearAllNotify()">清空通知</button>
    </div>
    <div id="notifyListContent"></div>
  </div>
</div>

<!-- 发帖弹窗 -->
<div class="mask" id="popMask">
  <div class="pop-post">
    <form id="popForm">
      <div class="popup-avatar-row">
        <img class="popup-avatar" id="popupUserAvatar" alt="用户头像">
        <span class="popup-nick fs-lg" id="popupUserNick"></span>
      </div>

      <div id="replyTip" class="fs-sm" style="color:var(--text-second);display:none;"></div>
      <textarea name="content" class="fs-lg"></textarea>
      
      <div style="display:flex; align-items:center; width:100%; gap:8px; flex-wrap:nowrap;">
        <span id="mediaBox" style="white-space: nowrap; display: inline-block; min-width: 120px; flex:1;">
          <div id="mediaStatus"></div>
          <div id="uploadProgressWrap" style="display: none; margin: 4px 0;">
            <div style="width:100%;height:8px;background:var(--border-line);border-radius:4px;overflow:hidden;">
              <div id="uploadProgressBar" style="width:0%;height:100%;background:var(--blue);transition:width 0.1s linear;"></div>
            </div>
            <div class="fs-xs" style="color:var(--text-second);margin-top:2px;text-align:left;">
              <span id="progressText">0%</span>
            </div>
          </div>
        </span>
    
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0; white-space:nowrap; margin-left: auto;">
            <button type="button" class="btn fs-md" id="uploadBtn" style="padding:6px 10px;">上传媒体</button>
            <button class="btn fs-md" type="submit" style="padding:6px 10px;">发布</button>
        </div>
      
        <input type="hidden" name="media" id="mediaInput" value="">
    </div>
        
      <input type="file" id="fileSelector" style="display:none;" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm">
      <input type="hidden" name="name" id="popNick">
      <input type="hidden" id="hidPid" name="pid" value="">
      <input type="hidden" id="hidRid" name="targetRid" value="">
      <input type="hidden" name="targetUser" id="targetUser" value="">
    </form>
  </div>
</div>

<div class="notice-full-modal" id="noticeFullModal">
  <div class="modal-content" id="noticeModalContent">
  </div>
</div>

<!-- 通知独立页面【已改造】 -->
<div class="notify-page" id="notifyPage" style="display: none;">
  <div class="page-inner" style="max-width:700px;margin:0 auto;padding:0 12px;">
    <!-- 头部：标题左，按钮组右 -->
    <div class="notify-page-header">
      <h2 class="notify-page-title">消息通知</h2>
      <div class="notify-page-btn-group">
        <button class="btn" id="pageReadAll">全部已读</button>
        <button class="btn del-btn" id="pageClearAll">清空通知</button>
      </div>
    </div>
    <!-- 通知列表 -->
    <div id="pageNotifyList"></div>
    <div class="empty-tip" id="notifyEmptyTip" style="display:none;">暂无消息通知</div>
  </div>
</div>
  
<script src="main.js" defer></script>
</body>
</html>
