<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
<title>留言板 - 在线匿名留言交流社区</title>
<meta name="description" content="轻量匿名留言板，支持发帖、图文视频上传、回复互动，永久免费，电脑手机自适应访问。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://mb.lovefree.de5.net">
<meta property="og:type" content="website">
<meta property="og:title" content="留言板 - 在线匿名留言交流社区">
<meta property="og:url" content="https://mb.lovefree.de5.net">
<meta property="og:site_name" content="匿名留言板">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶部唯一状态栏：全程共用，无多套导航按钮 -->
<header class="top-bar">
  <div class="top-bar-inner">
    <button type="button" class="back-link" id="backLink"></button>
    <span class="view-title" id="viewTitle">帖子列表</span>
    <div class="nav-right-group">
      <button type="button" class="notify-link" id="notifyLink">通知(0)</button>
      <button type="button" class="post-btn-top" id="topPostBtn">发帖</button>
    </div>
  </div>
</header>

<!-- 中间唯一内容容器：列表/详情/通知 全部渲染在这里 -->
<main class="main-container">
  <div id="mainView"></div>
  <div id="loadTip" class="fs-sm load-tip">加载中...</div>
</main>

<!-- 底部常驻输入区：统一承载发帖/回复/上传，替代所有弹窗 -->
<footer class="bottom-input" id="editorWrap">
  <form id="publishForm">
    <!-- 媒体预览与状态 -->
    <div class="media-preview-box" id="mediaPreviewBox"></div>
    <div id="mediaStatus"></div>
    <div id="uploadProgressWrap" style="display: none;">
      <div class="progress-bar-bg">
        <div id="uploadProgressBar" class="progress-bar-fill"></div>
      </div>
      <div class="fs-xs progress-text"><span id="progressText">0%</span></div>
    </div>

    <!-- 输入框 -->
    <textarea name="content" id="contentInput" placeholder="输入内容发布新帖子..."></textarea>

    <!-- 操作栏 -->
    <div class="input-action-row">
      <button type="button" id="uploadBtn" class="text-btn">上传媒体</button>
      <button type="submit" class="primary-btn">发送</button>
    </div>

    <!-- 隐藏字段 -->
    <input type="file" id="fileSelector" style="display:none;" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm">
    <input type="hidden" name="media" id="mediaInput" value="">
    <input type="hidden" name="name" id="hidNick">
    <input type="hidden" id="hidPid" name="pid" value="">
    <input type="hidden" id="hidRid" name="targetRid" value="">
    <input type="hidden" name="targetUser" id="targetUser" value="">
  </form>
</footer>

<script src="main.js" defer></script>
</body>
</html>
