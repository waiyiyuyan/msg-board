<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>留言板</title>
<!-- 引入外部CSS样式文件 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 消息铃铛按钮 -->

<span class="badge" id="unReadBadge" style="display:none">0</span>
</button>

<!-- 悬浮发帖按钮 -->
<button class="float-add-btn" id="openPopBtn">
<svg viewBox="0 0 1024 1024" width="24" height="24" fill="#fff">

</svg>
</button>

<!-- 通知弹窗遮罩 -->
<div class="notify-mask" id="notifyMask">
  <div class="notify-box" id="notifyWrap">
    <!-- 通知操作按钮（永远保留，不会被覆盖） -->
    <div class="notify-btn-bar">
      <button class="btn" id="readAllBtn" onclick="readAllNotify()">全部已读</button>
      <button class="btn del-btn" id="clearNotifyBtn" onclick="clearAllNotify()">清空通知</button>
    </div>
    <div class="divider"></div>
    <!-- 【新增】通知列表专属容器（这里的内容会被动态更新） -->
    <div id="notifyListContent"></div>
  </div>
</div>
<!-- 统一共用弹窗：发帖+所有回复共用 -->
<div class="mask" id="popMask">
  <div class="pop-post">
    <form id="popForm">
      <!-- 新增：弹窗顶部 头像 + 昵称 展示区域 -->
      <div class="popup-avatar-row">
        <img class="popup-avatar" id="popupUserAvatar" alt="用户头像">
        <span class="popup-nick" id="popupUserNick"></span>
      </div>

      <div id="replyTip" style="color:#999;font-size:13px;display:none;"></div>
      <textarea name="content"></textarea>
      
      <div style="display:flex; align-items:center; width:100%; gap:10px;">
        <!-- 左侧：上传提示/移除按钮（自动靠左） -->
        <span id="mediaBox" style="white-space: nowrap;"></span>
    
        <!-- 关键：中间的占位元素，自动填满剩余空间，把右边按钮推到最右侧 -->
        <div style="flex: 1;"></div>
    
        <!-- 右侧：按钮组（自动靠右） -->
        <div style="display:flex; align-items:center; gap:10px;">
            <button type="button" class="btn" id="uploadBtn">上传图片</button>
            <button class="btn" type="submit">发布</button>
        </div>
    
        <input type="hidden" name="media" id="mediaInput" value="">
    </div>
        
      <input type="file" id="fileSelector" style="display:none;" accept="image/jpeg,image/png,image/gif,image/webp">
      <input type="hidden" name="title" value="">
      <input type="hidden" name="name" id="popNick">
      <input type="hidden" id="hidPid" name="pid" value="">
      <input type="hidden" id="hidRid" name="targetRid" value="">
      <input type="hidden" name="targetUser" id="targetUser" value="">
    </form>
  </div>
</div>

<div id="listBox"></div>
<!-- 分页加载提示（默认显示加载中，避免首屏闪烁） -->
<div id="loadTip" style="text-align:center;padding:18px 0;color:#86868b;font-size:14px;cursor:default;">
  加载中...
</div>
  
<!-- 图片放大预览弹窗 -->
<div class="img-preview-mask" id="imgPreviewMask">
  <img src="" alt="大图预览" id="previewImg">
</div>
  <!-- ========== 新增：通知详情 全屏弹窗（纯结构，样式统一放在 style.css） ========== -->
<div class="notice-full-modal" id="noticeFullModal">
  <div class="modal-content" id="noticeModalContent">
    <!-- 帖子、回复内容由 JS 动态渲染，此处留空 -->
  </div>
<!-- ===================================================================== -->

<!-- 引入外部 JS 文件（放在 body 末尾，保证 DOM 加载完成再执行脚本） -->
<script src="main.js"></script>
</body>
</html>
